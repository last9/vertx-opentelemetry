name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn test -B --no-transfer-progress

      - name: Build JARs
        run: mvn package -B --no-transfer-progress -DskipTests

      - name: Verify ByteBuddy relocation
        run: |
          echo "Checking v3 shaded JAR..."
          V3_JAR=$(ls vertx3-rxjava2-otel-autoconfigure/target/vertx3-rxjava2-otel-autoconfigure-*.jar | grep -v javadoc | grep -v sources | head -1)
          ORIGINAL=$(unzip -l "$V3_JAR" | grep -c "net/bytebuddy/" || true)
          RELOCATED=$(unzip -l "$V3_JAR" | grep -c "io/last9/internal/bytebuddy/" || true)
          echo "  net/bytebuddy/ classes: $ORIGINAL (must be 0)"
          echo "  io/last9/internal/bytebuddy/ classes: $RELOCATED (must be >0)"
          if [ "$ORIGINAL" -ne 0 ]; then
            echo "FAIL: net/bytebuddy/ classes found in shaded JAR — relocation broken"
            exit 1
          fi
          if [ "$RELOCATED" -eq 0 ]; then
            echo "FAIL: no relocated ByteBuddy classes found — relocation missing"
            exit 1
          fi
          echo "PASS: ByteBuddy correctly relocated to io.last9.internal.bytebuddy"

      - name: Verify agent Java 8 compatibility
        run: |
          echo "Checking agent JAR class file version..."
          AGENT_JAR=$(ls vertx3-otel-agent/target/vertx3-otel-agent-*.jar | grep -v javadoc | grep -v sources | head -1)
          # Extract AgentBootstrap.class and check its magic bytes for major version
          # Class file format: 4 bytes magic (0xCAFEBABE), 2 bytes minor, 2 bytes major
          # major 52 = Java 8, 55 = Java 11
          MAJOR=$(unzip -p "$AGENT_JAR" io/last9/tracing/otel/agent/AgentBootstrap.class | od -An -tx1 -j6 -N2 | tr -d ' \n' | awk '{print toupper($0)}' | xargs -I{} printf "%d" "0x{}")
          echo "  AgentBootstrap.class major version: $MAJOR (must be 52 for Java 8)"
          if [ "$MAJOR" -ne 52 ]; then
            echo "FAIL: agent bootstrap compiled to class file $MAJOR, not 52 — Java 8 JVMs will crash"
            exit 1
          fi
          echo "PASS: agent bootstrap compiled to class file 52 (Java 8 compatible)"

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ github.sha }}
          retention-days: 14
          path: |
            vertx4-rxjava3-otel-autoconfigure/target/*.jar
            vertx3-rxjava2-otel-autoconfigure/target/*.jar
            vertx3-otel-agent/target/*.jar
